
<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MyKas - Aplikasi Uang Kas</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f0f5f2;
            margin: 0;
            padding: 20px;
            color: #26352c;
        }

        .container {
            max-width: 520px;
            margin: 20px auto;
            padding: 24px;
            background: white;
            border-radius: 16px;
            box-shadow: 0 4px 15px #00000012;
        }

        h1 {
            text-align: center;
            color: #167447;
            margin-bottom: 5px;
        }

        .subtitle {
            text-align: center;
            color: #68776d;
            margin-bottom: 24px;
        }

        .saldo {
            background: #167447;
            color: white;
            padding: 20px;
            border-radius: 12px;
            text-align: center;
        }

        .saldo h2 {
            margin: 10px 0;
            font-size: 30px;
            overflow-wrap: anywhere;
        }

        label {
            display: block;
            margin-top: 15px;
            font-weight: bold;
        }

        input, select, button {
            width: 100%;
            padding: 12px;
            margin-top: 8px;
            border-radius: 8px;
            font-size: 15px;
        }

        input, select {
            border: 1px solid #ccd6ce;
            background: white;
        }

        button {
            border: none;
            background: #167447;
            color: white;
            cursor: pointer;
            font-weight: bold;
        }

        button:hover {
            background: #105b36;
        }

        .riwayat {
            margin-top: 28px;
        }

        .transaksi {
            padding: 12px;
            border-bottom: 1px solid #e5ebe6;
            overflow-wrap: anywhere;
        }

        .masuk {
            color: #167447;
        }

        .keluar {
            color: #c0392b;
        }

        .kosong {
            color: #78847c;
            text-align: center;
            padding: 16px 0;
        }

        .reset {
            background: #b93838;
            margin-top: 18px;
        }

        footer {
            text-align: center;
            margin-top: 22px;
            font-size: 12px;
            color: #78847c;
        }
    </style>
</head>

<body>
    <main class="container">
        <h1>💰 MyKas</h1>
        <p class="subtitle">Aplikasi Pengelolaan Uang Kas</p>

        <section class="saldo">
            <p>Saldo Uang Kas</p>
            <h2 id="saldo">Rp0</h2>
            <p>Kelola uang kas dengan mudah!</p>
        </section>

        <form id="formKas">
            <label for="nama">Nama transaksi</label>
            <input
                type="text"
                id="nama"
                maxlength="100"
                placeholder="Contoh: Kas kelas"
                required
            >

            <label for="jumlah">Jumlah uang (Rp)</label>
            <input
                type="number"
                id="jumlah"
                min="1"
                step="1"
                placeholder="Masukkan jumlah uang"
                required
            >

            <label for="jenis">Jenis transaksi</label>
            <select id="jenis">
                <option value="masuk">Pemasukan</option>
                <option value="keluar">Pengeluaran</option>
            </select>

            <button type="submit">+ Simpan Transaksi</button>
        </form>

        <section class="riwayat">
            <h3>📋 Riwayat Transaksi MyKas</h3>
            <div id="daftar">
                <p class="kosong">Belum ada transaksi.</p>
            </div>
        </section>

        <button type="button" class="reset" id="reset">
            Hapus Semua Data
        </button>

        <footer>
            MyKas © 2026 | Aplikasi Uang Kas
        </footer>
    </main>

    <script>
        const KEY = "mykas_data_v1";
        let transaksi = [];

        try {
            const data = JSON.parse(localStorage.getItem(KEY) || "[]");
            if (Array.isArray(data)) transaksi = data;
        } catch {
            transaksi = [];
        }

        const formatRupiah = angka =>
            "Rp" + angka.toLocaleString("id-ID");

        function simpan() {
            try {
                localStorage.setItem(KEY, JSON.stringify(transaksi));
                return true;
            } catch {
                alert("Data gagal disimpan di browser.");
                return false;
            }
        }

        function hitungSaldo() {
            return transaksi.reduce((total, item) => {
                return total + (
                    item.jenis === "masuk"
                        ? item.jumlah
                        : -item.jumlah
                );
            }, 0);
        }

        function tampilkan() {
            document.getElementById("saldo").textContent =
                formatRupiah(hitungSaldo());

            const daftar = document.getElementById("daftar");
            daftar.replaceChildren();

            if (transaksi.length === 0) {
                const p = document.createElement("p");
                p.className = "kosong";
                p.textContent = "Belum ada transaksi.";
                daftar.appendChild(p);
                return;
            }

            transaksi.forEach(item => {
                const div = document.createElement("div");
                div.className = "transaksi";

                const nama = document.createElement("strong");
                nama.textContent = item.nama;

                const detail = document.createElement("div");
                detail.className = item.jenis;
                detail.textContent =
                    (item.jenis === "masuk" ? "+ " : "- ") +
                    formatRupiah(item.jumlah);

                const tanggal = document.createElement("small");
                tanggal.textContent = item.tanggal;

                div.append(nama, detail, tanggal);
                daftar.appendChild(div);
            });
        }

        document.getElementById("formKas").addEventListener(
            "submit", function(e) {
                e.preventDefault();

                const nama = document.getElementById("nama")
                    .value.trim();
                const jumlah = Number(
                    document.getElementById("jumlah").value
                );
                const jenis = document.getElementById("jenis").value;

                if (
                    !nama ||
                    !Number.isSafeInteger(jumlah) ||
                    jumlah <= 0
                ) {
                    alert("Masukkan nama dan jumlah uang yang valid.");
                    return;
                }

                if (!["masuk", "keluar"].includes(jenis)) {
                    alert("Jenis transaksi tidak valid.");
                    return;
                }

                if (jenis === "keluar" && jumlah > hitungSaldo()) {
                    alert("Saldo MyKas tidak mencukupi!");
                    return;
                }

                const item = {
                    nama,
                    jumlah,
                    jenis,
                    tanggal: new Date().toLocaleString("id-ID")
                };

                transaksi.unshift(item);

                if (!simpan()) {
                    transaksi.shift();
                    return;
                }

                tampilkan();
                this.reset();
                alert("Transaksi berhasil disimpan!");
            }
        );

        document.getElementById("reset").addEventListener(
            "click", function() {
                if (!confirm("Yakin ingin menghapus semua data MyKas?")) {
                    return;
                }

                const sebelumnya = transaksi;
                transaksi = [];

                if (!simpan()) {
                    transaksi = sebelumnya;
                    return;
                }

                tampilkan();
            }
        );

        tampilkan();
    </script>
</body>
</html>
